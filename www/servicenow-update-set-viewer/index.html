<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ServiceNow Update Set Viewer</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/styles/default.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/highlight.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/languages/javascript.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/languages/xml.min.js"></script>
  <style>
    .file-upload {
      text-align: center;
      padding: 2rem;
      border: 2px dashed var(--primary);
      border-radius: 0.5rem;
      margin-bottom: 2rem;
    }
    
    .hidden {
      display: none;
    }
    
    .table-container {
      margin-bottom: 2rem;
    }
    
    .object-header {
      margin-top: 2rem;
      padding: 0.5rem;
      background: var(--primary);
      color: var(--primary-inverse);
      border-radius: 0.25rem;
    }
    
    .spinner {
      display: inline-block;
      width: 1rem;
      height: 1rem;
      border: 2px solid rgba(0, 0, 0, 0.1);
      border-left-color: var(--primary);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    details {
      background-color: var(--card-background-color);
      border-radius: 0.25rem;
      margin-bottom: 1rem;
      padding: 0.5rem;
    }
    
    details summary {
      cursor: pointer;
      font-weight: bold;
    }
    
    pre code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-size: 0.875rem;
      border-radius: 0.25rem;
      padding: 1rem !important;
      overflow-x: auto;
      white-space: pre;
      word-break: normal;
      word-wrap: normal;
    }
    
    .code-container {
      margin-top: 0.5rem;
      margin-bottom: 0.5rem;
      border-radius: 0.25rem;
      background-color: var(--code-background-color);
    }
    
    /* Custom styles for payload sections */
    .payload-container {
      margin-top: 1rem;
      margin-bottom: 1rem;
    }
    
    .payload-section {
      margin-top: 1rem;
      padding: 0.5rem;
      border-radius: 0.25rem;
    }
    
    /* Make tables more compact */
    table {
      font-size: 0.9rem;
    }
    
    td, th {
      padding: 0.5rem 0.75rem;
    }
    
    /* Better visibility for nested tables */
    .nested-table {
      background-color: rgba(0, 0, 0, 0.02);
      border-left: 3px solid var(--primary);
      margin-left: 1rem;
      padding-left: 0.5rem;
    }
    
    /* Utility for long text fields */
    .truncate {
      max-width: 50vw;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <main class="container">
    <h1>ServiceNow Update Set Viewer</h1>
    
    <article class="file-upload" id="dropZone">
      <h2>Upload ServiceNow Update Set XML</h2>
      <p>Drag and drop your XML file here or click to browse</p>
      <input type="file" id="fileInput" accept=".xml" class="hidden">
      <div id="loadingIndicator" class="hidden">
        <span class="spinner"></span> Processing XML file...
      </div>
    </article>
    
    <div id="updateSetInfo" class="hidden">
      <h2>Update Set Information</h2>
      <div id="updateSetDetails"></div>
    </div>
    
    <div id="updateObjects" class="hidden">
      <h2>Update Objects</h2>
      <div id="objectsContainer"></div>
    </div>
    
    <div id="errorMessage" class="hidden">
      <article>
        <header>Error</header>
        <p id="errorText"></p>
      </article>
    </div>
  </main>

  <script type="module" src="main.js"></script>
</body>
</html>
